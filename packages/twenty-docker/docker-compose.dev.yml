# Self-contained npm development stack (app + Postgres + Redis).
# The app code and npm dependencies are baked into the Docker image.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down       # stop
#   docker compose -f docker-compose.dev.yml down -v    # stop + wipe data

name: twenty-dev

services:
  app:
    build:
      context: ../..
      dockerfile: packages/twenty-docker/twenty/Dockerfile.npm-dev
    working_dir: /app
    command: ["npm", "run", "dev:docker"]
    volumes:
      - dev-app-server-data:/app/packages/twenty-server/.local-storage
    ports:
      - "${TWENTY_FRONT_PORT:-3001}:3001"
      - "${TWENTY_SERVER_PORT:-3002}:3002"
    environment:
      NODE_ENV: development
      TWENTY_DOCKER_DEV: "true"
      VITE_HOST: 0.0.0.0
      NODE_PORT: 3002
      PG_DATABASE_URL: postgres://postgres:postgres@db:5432/default
      REDIS_URL: redis://redis:6379
      APP_SECRET: twenty-local-dev-secret
      SIGN_IN_PREFILLED: "true"
      IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: "false"
      FRONTEND_URL: http://localhost:3001
      REACT_APP_SERVER_BASE_URL: http://localhost:3002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3001/"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 30
    develop:
      watch:
        - action: sync
          path: ../..
          target: /app
          initial_sync: true
          ignore:
            - package-lock.json
            - .npmrc
            - packages/twenty-front/package.json
            - packages/twenty-server/package.json
            - packages/twenty-emails/package.json
            - packages/twenty-ui/package.json
            - packages/twenty-shared/package.json
            - packages/twenty-sdk/package.json
            - packages/twenty-front-component-renderer/package.json
            - packages/twenty-client-sdk/package.json
        - action: rebuild
          path: ../../package-lock.json
        - action: rebuild
          path: ../../.npmrc
        - action: rebuild
          path: ../../packages/twenty-front/package.json
        - action: rebuild
          path: ../../packages/twenty-server/package.json
        - action: rebuild
          path: ../../packages/twenty-emails/package.json
        - action: rebuild
          path: ../../packages/twenty-ui/package.json
        - action: rebuild
          path: ../../packages/twenty-shared/package.json
        - action: rebuild
          path: ../../packages/twenty-sdk/package.json
        - action: rebuild
          path: ../../packages/twenty-front-component-renderer/package.json
        - action: rebuild
          path: ../../packages/twenty-client-sdk/package.json
    restart: unless-stopped

  db:
    image: postgres:16
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    ports:
      - "${TWENTY_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "${TWENTY_REDIS_PORT:-6380}:6379"
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  dev-db-data:
  dev-app-server-data:
